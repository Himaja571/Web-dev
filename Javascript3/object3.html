<!DOCTYPE html>
<head>
<head>
<title>Javascript object</title
<head>
<body>
<h1>The javascript object creation</h1>
<h2>Object method</h2>
<p id="demo"></p>
<script>
const person={
    firstname:"John",
    lastname:"patel",
    age: "20" ,
    fullname: function(){
       return this.firstname + " "+this.lastname 
    }
    };


    document.getElementById('demo').innerHTML=person.fullname();

</script>

</body>
</html>
