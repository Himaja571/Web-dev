<!DOCTYPE html>
<html>
<head>
<title>The Javascript  mouse events</title>
</head>
<body>
<h1>the JavaScript mouseout and mouseover event</h1>
<div id="box" style="width:200px;height:100px;margin:50px; padding:16px;border: 2px  solid black;">Move mouse over the box</div>
<script>
const box=document.getElementById("box")
//let box listen for mouseover
box.addEventListener("mouseover",function(){
  box.innerHTML="Mouse is over me!";
});
//let box listen for mouseout
box.addEventListener("mouseout",function(){
box.innerHTML="Mouse is out";
});
</script>
</body>
</html>
