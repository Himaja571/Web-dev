<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Events</h1>
<h2>Enter Key</h2>

<input id="input" placeholder="Press Enter">

<p id="result"></p>

<script>
const input = document.getElementById("input");
const result = document.getElementById("result");

input.addEventListener("keydown", function (event) {

  if (event.key === "Enter") {
    result.innerHTML = "You pressed Enter!";
  }

});
</script>

</body>
</html>
