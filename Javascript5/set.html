<!DOCTYPE html>
<head>
<title> The JavaScript Sets</title>
</head>
<body>
<h1>The JavaScript Sets creation</h1>
<h2>The JavaScript add() method</h2>
<p id ="demo"></p>
<script>
const letters=new Set();
const a="a";
const b="b";
const c="c";
letters.add(a);
letters.add(b);
letters.add(c);

document.getElementById("demo").innerHTML="The set contains the "+letters.size +"  values"
</script>
</body>
</html>
